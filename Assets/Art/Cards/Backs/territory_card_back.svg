<svg width="500" height="700" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#415668"/>
      <stop offset="1" stop-color="#182631"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65b4dc"/>
      <stop offset="1" stop-color="#1c4d71"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#112c44"/>
      <stop offset="1" stop-color="#0a1b2b"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05121d" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#02090f" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="steelLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3edf9"/>
      <stop offset="1" stop-color="#7eb2d0"/>
    </linearGradient>
    <pattern id="camo" patternUnits="userSpaceOnUse" width="140" height="140">
      <rect width="140" height="140" fill="#3b4e57"/>
      <path d="M0 24 C20 6,44 6,70 22 C96 38,118 38,140 18 L140 58 C118 70,96 70,70 56 C44 40,20 42,0 62 Z" fill="#506670"/>
      <path d="M0 84 C20 68,42 68,66 84 C90 100,114 102,140 92 L140 140 L0 140 Z" fill="#2f4048"/>
      <ellipse cx="26" cy="104" rx="22" ry="11" fill="#22313a"/>
      <ellipse cx="102" cy="44" rx="26" ry="13" fill="#5d7682"/>
      <ellipse cx="122" cy="108" rx="15" ry="8" fill="#1e2a33"/>
    </pattern>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="26" height="26">
      <path d="M26 0 H0 V26" fill="none" stroke="#9fcee4" stroke-opacity="0.14" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7ed4ff" flood-opacity="0.35"/>
    </filter>
    <clipPath id="innerClip">
      <rect x="24" y="24" width="452" height="652" rx="24"/>
    </clipPath>
      <pattern id="diagPattern" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(35)">
      <rect width="20" height="20" fill="none"/>
      <path d="M0 10 H20" stroke="#d8c18f" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="8" y="8" width="484" height="684" rx="30" fill="url(#bg)" stroke="url(#rim)" stroke-width="9" filter="url(#shadow)"/>
  <rect x="16" y="16" width="468" height="668" rx="27" fill="none" stroke="#b7d7e8" stroke-width="2.2" opacity="0.85"/>

  <g clip-path="url(#innerClip)">
    <rect x="24" y="24" width="452" height="652" fill="url(#camo)"/>
    <rect x="24" y="24" width="452" height="652" fill="url(#grid)"/>
        <rect x="24" y="24" width="452" height="652" fill="url(#diagPattern)"/>
    <g id="corner-rivet" fill="#d9be8e" stroke="#3a2c1a" stroke-width="1.6" opacity="0.9">
      <circle cx="54" cy="54" r="5"/>
      <circle cx="446" cy="54" r="5"/>
      <circle cx="54" cy="646" r="5"/>
      <circle cx="446" cy="646" r="5"/>
    </g>
    <image x="-160" y="24" width="820" height="676" transform="rotate(-16 250 350)" href="maps/world-classic/Risk_board.svg" preserveAspectRatio="xMidYMid slice" opacity="0.24"/>
    <rect x="24" y="24" width="452" height="652" fill="url(#vignette)"/>
  </g>

  <rect x="34" y="34" width="432" height="106" rx="20" fill="url(#panel)" stroke="#07111c" stroke-width="4"/>
  <rect x="42" y="42" width="416" height="90" rx="16" fill="none" stroke="#8ac5e4" stroke-width="1.4" opacity="0.85"/>
  <text x="250" y="88" text-anchor="middle" dominant-baseline="middle" font-size="74" fill="#ffffff" stroke="#0c0c0c" stroke-width="7" paint-order="stroke fill"
        font-family="Impact, Arial Black, sans-serif" font-weight="900" letter-spacing="3">RisiKo!</text>

  <g transform="translate(250 356)">
    <circle cx="0" cy="0" r="134" fill="#0e1f2a" fill-opacity="0.48" stroke="url(#steelLine)" stroke-width="3"/>
    <circle cx="0" cy="0" r="108" fill="none" stroke="#a7d3ec" stroke-width="1.4" opacity="0.8"/>
    <path d="M0 -108 L18 -30 L94 0 L18 30 L0 108 L-18 30 L-94 0 L-18 -30 Z" fill="#77c6f1" fill-opacity="0.78" stroke="#d4f0ff" stroke-width="2" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="24" fill="#10283a" stroke="#bde8ff" stroke-width="2"/>
    <text x="0" y="3" text-anchor="middle" dominant-baseline="middle" fill="#eff9ff" font-size="18" font-weight="900" font-family="Trebuchet MS, Arial, sans-serif">TER</text>
  </g>

  <g stroke="#86c7e5" stroke-width="2.2" fill="none" opacity="0.82">
    <path d="M94 524 L160 472 L206 500 L240 462"/>
    <path d="M406 524 L340 472 L294 500 L260 462"/>
  </g>
  <g fill="#d8f1ff" opacity="0.9">
    <circle cx="92" cy="524" r="3.4"/>
    <circle cx="160" cy="472" r="3.4"/>
    <circle cx="206" cy="500" r="3.4"/>
    <circle cx="240" cy="462" r="3.4"/>
    <circle cx="406" cy="524" r="3.4"/>
    <circle cx="340" cy="472" r="3.4"/>
    <circle cx="294" cy="500" r="3.4"/>
    <circle cx="260" cy="462" r="3.4"/>
  </g>

  <text x="250" y="612" text-anchor="middle" dominant-baseline="middle" font-size="39" fill="#edf8ff" stroke="#0f1922" stroke-width="2.2" paint-order="stroke fill"
        font-family="Trebuchet MS, Arial, sans-serif" font-weight="900" letter-spacing="1.6">RETRO TERRITORIO</text>
  <text x="250" y="642" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#b9d8ea" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700" letter-spacing="1.1">DECK CONQUISTE</text>
</svg>

