<svg width="500" height="700" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5845"/>
      <stop offset="1" stop-color="#222a22"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d14b3f"/>
      <stop offset="1" stop-color="#641612"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1f1f"/>
      <stop offset="1" stop-color="#151012"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f0c" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#050807" stop-opacity="0.68"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d79a"/>
      <stop offset="1" stop-color="#c59a4f"/>
    </linearGradient>
    <pattern id="camo" patternUnits="userSpaceOnUse" width="140" height="140">
      <rect width="140" height="140" fill="#59664a"/>
      <path d="M0 22 C22 5,45 5,70 20 C95 35,118 35,140 16 L140 54 C118 66,95 66,70 52 C45 38,22 40,0 58 Z" fill="#788761"/>
      <path d="M0 84 C20 68,42 68,66 84 C90 100,114 102,140 92 L140 140 L0 140 Z" fill="#414f36"/>
      <ellipse cx="26" cy="104" rx="22" ry="11" fill="#303b2a"/>
      <ellipse cx="102" cy="44" rx="26" ry="13" fill="#667750"/>
      <ellipse cx="122" cy="108" rx="15" ry="8" fill="#283123"/>
    </pattern>
    <pattern id="grid" patternUnits="userSpaceOnUse" width="28" height="28">
      <path d="M28 0 H0 V28" fill="none" stroke="#9dc2b1" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffd69b" flood-opacity="0.32"/>
    </filter>
    <clipPath id="innerClip">
      <rect x="24" y="24" width="452" height="652" rx="24"/>
    </clipPath>
      <pattern id="diagPattern" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(35)">
      <rect width="20" height="20" fill="none"/>
      <path d="M0 10 H20" stroke="#d8c18f" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="8" y="8" width="484" height="684" rx="30" fill="url(#bg)" stroke="url(#rim)" stroke-width="9" filter="url(#shadow)"/>
  <rect x="16" y="16" width="468" height="668" rx="27" fill="none" stroke="#d1b071" stroke-width="2.2" opacity="0.9"/>

  <g clip-path="url(#innerClip)">
    <rect x="24" y="24" width="452" height="652" fill="url(#camo)"/>
    <rect x="24" y="24" width="452" height="652" fill="url(#grid)"/>
        <rect x="24" y="24" width="452" height="652" fill="url(#diagPattern)"/>
    <g id="corner-rivet" fill="#d9be8e" stroke="#3a2c1a" stroke-width="1.6" opacity="0.9">
      <circle cx="54" cy="54" r="5"/>
      <circle cx="446" cy="54" r="5"/>
      <circle cx="54" cy="646" r="5"/>
      <circle cx="446" cy="646" r="5"/>
    </g>
    <image x="-156" y="18" width="820" height="676" transform="rotate(-16 250 350)" href="maps/world-classic/Risk_board.svg" preserveAspectRatio="xMidYMid slice" opacity="0.22"/>
    <rect x="24" y="24" width="452" height="652" fill="url(#vignette)"/>
  </g>

  <rect x="34" y="34" width="432" height="106" rx="20" fill="url(#panel)" stroke="#080808" stroke-width="4"/>
  <rect x="42" y="42" width="416" height="90" rx="16" fill="none" stroke="#c9a35f" stroke-width="1.4" opacity="0.8"/>
  <text x="250" y="88" text-anchor="middle" dominant-baseline="middle" font-size="74" fill="#ffffff" stroke="#0c0c0c" stroke-width="7" paint-order="stroke fill"
        font-family="Impact, Arial Black, sans-serif" font-weight="900" letter-spacing="3">RisiKo!</text>

  <g transform="translate(250 353)">
    <circle cx="0" cy="0" r="132" fill="#181d1b" fill-opacity="0.44" stroke="url(#goldLine)" stroke-width="3"/>
    <circle cx="0" cy="0" r="108" fill="none" stroke="#efc679" stroke-width="1.4" opacity="0.75"/>
    <path d="M0 -94 L20 -24 L94 0 L20 24 L0 94 L-20 24 L-94 0 L-20 -24 Z" fill="#d6b070" fill-opacity="0.76" stroke="#f1dbb0" stroke-width="2" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="24" fill="#30130f" stroke="#f4cf8c" stroke-width="2"/>
    <text x="0" y="3" text-anchor="middle" dominant-baseline="middle" fill="#ffe7bd" font-size="18" font-weight="900" font-family="Trebuchet MS, Arial, sans-serif">OBJ</text>
  </g>

  <g fill="none" stroke="#d2aa66" stroke-width="3" opacity="0.9">
    <path d="M120 510 C86 500, 70 466, 78 430 C86 396, 115 378, 146 382"/>
    <path d="M380 510 C414 500, 430 466, 422 430 C414 396, 385 378, 354 382"/>
  </g>
  <g fill="#f0d49b" opacity="0.92">
    <circle cx="98" cy="450" r="4"/>
    <circle cx="402" cy="450" r="4"/>
    <circle cx="124" cy="404" r="3"/>
    <circle cx="376" cy="404" r="3"/>
  </g>

  <text x="250" y="612" text-anchor="middle" dominant-baseline="middle" font-size="39" fill="#f4efe3" stroke="#0f1411" stroke-width="2.2" paint-order="stroke fill"
        font-family="Trebuchet MS, Arial, sans-serif" font-weight="900" letter-spacing="1.6">RETRO OBIETTIVO</text>
  <text x="250" y="642" text-anchor="middle" dominant-baseline="middle" font-size="17" fill="#d7c0a2" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700" letter-spacing="1.1">MISSIONE SEGRETA</text>
</svg>

