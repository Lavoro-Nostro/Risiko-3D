<svg xmlns="http://www.w3.org/2000/svg" width="500" height="700" viewBox="0 0 500 700">
  <defs>
    <linearGradient id="cardBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f2e4"/>
      <stop offset="1" stop-color="#eadcc1"/>
    </linearGradient>
    <linearGradient id="brandPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f1714"/>
      <stop offset="1" stop-color="#190d0b"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e7"/>
      <stop offset="1" stop-color="#f2e3c6"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0a141a" stop-opacity="0.34"/>
    </linearGradient>
    <pattern id="camo" patternUnits="userSpaceOnUse" width="120" height="120">
      <rect width="120" height="120" fill="#58634a"/>
      <path d="M0 20 C18 4,40 4,64 20 C84 34,102 34,120 18 L120 48 C102 60,84 60,64 48 C40 34,18 36,0 54 Z" fill="#73815c"/>
      <path d="M0 74 C16 62,36 62,56 74 C76 86,98 88,120 78 L120 120 L0 120 Z" fill="#44513a"/>
      <ellipse cx="26" cy="96" rx="20" ry="10" fill="#2f3929"/>
      <ellipse cx="88" cy="44" rx="24" ry="12" fill="#657350"/>
      <ellipse cx="104" cy="100" rx="16" ry="8" fill="#273022"/>
    </pattern>
    <pattern id="diag" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(35)">
      <rect width="18" height="18" fill="none"/>
      <path d="M0 9 H18" stroke="#d5bd8f" stroke-opacity="0.11" stroke-width="1.8"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="clip">
      <rect x="22" y="22" width="456" height="656" rx="24"/>
    </clipPath>
  </defs>

  <rect x="10" y="10" width="480" height="680" rx="30" fill="url(#cardBody)" stroke="#1f1f1f" stroke-width="8" filter="url(#shadow)"/>
  <rect x="18" y="18" width="464" height="664" rx="27" fill="none" stroke="#d0af71" stroke-width="2.1" opacity="0.92"/>

  <g clip-path="url(#clip)">
    <rect x="22" y="130" width="456" height="470" fill="url(#camo)"/>
    <rect x="22" y="130" width="456" height="470" fill="url(#diag)"/>
    <image x="-112" y="128" width="724" height="520" href="/packs/territories-png/world map.png" preserveAspectRatio="xMidYMid meet" opacity="0.2"/>
    <rect x="22" y="130" width="456" height="470" fill="url(#overlay)"/>
  </g>

  <rect x="26" y="26" width="448" height="118" rx="22" fill="url(#brandPanel)" stroke="#0f0a08" stroke-width="5"/>
  <text x="250" y="86" text-anchor="middle" dominant-baseline="middle" font-size="62" fill="#ffffff" stroke="#0e0e0e" stroke-width="6" paint-order="stroke fill" font-family="Impact, Arial Black, Trebuchet MS, sans-serif" font-weight="900" letter-spacing="3">OBIETTIVO</text>

  <rect x="50" y="170" width="400" height="420" rx="22" fill="url(#paper)" stroke="#8d7655" stroke-width="3"/>
  <rect x="66" y="188" width="368" height="154" rx="12" fill="#f8eacc" stroke="#ccb07f" stroke-width="1.4"/>
  <text x="250" y="266" text-anchor="middle" dominant-baseline="middle" font-size="34" fill="#283646" font-family="Trebuchet MS, Arial, sans-serif" font-weight="800">Titolo Missione</text>

  <rect x="66" y="356" width="368" height="184" rx="12" fill="#f7edd7" stroke="#ccb07f" stroke-width="1.2"/>
  <text x="250" y="446" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="#44586a" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">Testo missione qui</text>

  <g fill="#d9be8e" stroke="#3a2c1a" stroke-width="1.6" opacity="0.9">
    <circle cx="52" cy="52" r="5"/>
    <circle cx="448" cy="52" r="5"/>
    <circle cx="52" cy="648" r="5"/>
    <circle cx="448" cy="648" r="5"/>
  </g>

  <text x="250" y="656" text-anchor="middle" dominant-baseline="middle" font-size="24" fill="#2d2d2d" font-family="Trebuchet MS, Arial, sans-serif" font-weight="700">RisiKo!</text>
</svg>

